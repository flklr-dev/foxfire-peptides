services:
  db:
    image: mysql:8.0
    container_name: foxfire-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.9-php8.2-apache
    container_name: foxfire-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WP_ENVIRONMENT_TYPE: local
      FOXFIRE_LOCAL_MAIL_ENABLED: ${FOXFIRE_LOCAL_MAIL_ENABLED:-1}
      FOXFIRE_LOCAL_SMTP_HOST: ${FOXFIRE_LOCAL_SMTP_HOST:-mailpit}
      FOXFIRE_LOCAL_SMTP_PORT: ${FOXFIRE_LOCAL_SMTP_PORT:-1025}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: foxfire-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data

  wpcli:
    image: wordpress:cli-php8.2
    container_name: foxfire-wpcli
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WP_ENVIRONMENT_TYPE: local
      FOXFIRE_LOCAL_MAIL_ENABLED: ${FOXFIRE_LOCAL_MAIL_ENABLED:-1}
      FOXFIRE_LOCAL_SMTP_HOST: ${FOXFIRE_LOCAL_SMTP_HOST:-mailpit}
      FOXFIRE_LOCAL_SMTP_PORT: ${FOXFIRE_LOCAL_SMTP_PORT:-1025}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
    user: "33:33"
    entrypoint: wp
    command: "--info"
    profiles:
      - cli

volumes:
  db_data:
  mailpit_data:
  wordpress_data:
